<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAG Powerfood Checklist</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;--accent:#2f7d4f;--accent2:#d9eee1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#202220;--text:#ecebe6;--muted:#9a9890;--line:#33352f;--accent:#5cc189;--accent2:#1f3a2b}}
:root[data-theme="dark"]{--bg:#161715;--card:#202220;--text:#ecebe6;--muted:#9a9890;--line:#33352f;--accent:#5cc189;--accent2:#1f3a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 10px;z-index:5}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin:6px 0 10px;flex-wrap:wrap;gap:4px}
.stats b{color:var(--text)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.item.done{opacity:.55}
.item.done .nm{text-decoration:line-through}
.cb{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-top:1px}
.done .cb{background:var(--accent);border-color:var(--accent)}
.qty{font-weight:700;color:var(--accent)}
.unit{color:var(--muted);font-size:.85rem}
.for{display:none;font-size:.82rem;color:var(--muted);margin-top:6px}
.item.open .for{display:block}
.more{font-size:.78rem;color:var(--muted);margin-top:4px;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px}
.win{display:none;text-align:center;font-weight:700;color:var(--accent);padding:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>MAG Powerfood Crafting – Shopping List</h1>
<div class="bar"><i id="fill"></i></div>
<div class="stats"><span><b id="n1">0</b> / <span id="n2">0</span> ingredients</span><span><b id="u1">0</b> / <span id="u2">0</span> units</span><span><b id="pc">0</b>%</span></div>
<div class="ctl">
<input type="search" id="q" placeholder="Search ingredient or dish…">
<button id="hide">Hide done</button>
<button id="reset">Reset</button>
</div>
</div>
<div class="win" id="win">All ingredients collected!</div>
<div id="list"></div>
</div>
<script>
const D=[
[38,"Peeled Potato","whole","Fried Potatoes, Stir Fry, Fish And Chips, Haggis with Mashed Potatoes, Pommdoener, Bangers And Mash, Currywurst, Nuggies And Fries, Biff à la Nelson, Pork And Apple, Chicken Cordon Bleu, Ratatouille, Baked Potato With Vegetables, Baked Potato With Meat, Baked Potato With Seafood, Baked Potato with Beans, Paprikas Krumpli, Goulash, Fish Soup, Ukha, Beef Stew"],
[28,"Empty Box","box","Fried Potatoes, Stir Fry, Fish And Chips, Rice Pudding, Mushroom Risotto, Pilaf, Gagh, Haggis with Mashed Potatoes, Stuffed Peppers, Pommdoener, Bangers And Mash, Currywurst, Stuffed Mushrooms, Rabbit Roast, Nuggies And Fries, Schnitzel, Biff à la Nelson, Pork And Apple, Chicken Cordon Bleu, Ratatouille, Baked Potato With Vegetables, Baked Potato With Meat, Baked Potato With Seafood, Baked Potato with Beans, Rice à la Malta, Paprikas Krumpli, Fish Sticks, Paella"],
[25,"Tomato","whole","Stir Fry, Pilaf, Currywurst, Rabbit Roast, Ratatouille, Baked Potato With Vegetables, Paella, Fish Soup, Ukha, Lecso, Zucchini Caviar, Creamy Tomato Soup, Beef Stew, Chili Con Carne"],
[19,"Green Bell Pepper","whole","Stir Fry, Pilaf, Stuffed Peppers, Rabbit Roast, Ratatouille, Baked Potato With Vegetables, Paprikas Krumpli, Goulash, Lecso, Zucchini Caviar, Beef Stew, Chili Con Carne"],
[17,"Empty Can","can","Goulash, Pumpkin Soup, Fish Soup, Ukha, Lecso, Mystery Meat, Zucchini Caviar, Creamy Tomato Soup, Mushroom Stroganoff, Beef Stew, Bone Broth, Chili Con Carne, Spaghetti with Meatballs, Wobbly Delight with Peaches, Apple Marmalade, Plum Marmalade, Pear Marmalade"],
[16,"Any Meat","steaks","Stuffed Peppers, Schnitzel, Biff à la Nelson, Baked Potato With Meat, Goulash, Mystery Meat, Chili Con Carne, Spaghetti with Meatballs"],
[13,"Lard / Animal Fat","piece","Fried Potatoes, Stir Fry, Fish And Chips, Pommdoener, Currywurst, Nuggies And Fries, Schnitzel, Pork And Apple, Fish Sticks, Lecso, Mystery Meat, Cheese"],
[11,"Any Mushroom","caps","Mushroom Risotto, Stuffed Mushrooms, Mushroom Stroganoff"],
[10,"Animal Guts","unit","Haggis with Mashed Potatoes, Beef Sausage, Chicken Sausage, Pig Sausage, Goat Sausage, Bear Sausage, Sheep Sausage, Deer Sausage, Hare Sausage, Wolf Sausage"],
[10,"Animal Bones","bones","Wobbly Delight with Peaches"],
[8,"Any Fish","fillet","Fish And Chips, Baked Potato With Seafood, Fish Sticks, Paella, Fish Soup, Ukha"],
[8,"Chicken Breast","breasts","Nuggies And Fries, Chicken Cordon Bleu, Paella, Chicken Sausage"],
[7,"Apple","fruit","Pork And Apple, Apple Marmalade"],
[6,"Zucchini","whole","Stir Fry, Ratatouille, Baked Potato With Vegetables, Zucchini Caviar"],
[6,"Powdered Milk","pack","Rice Pudding, Rice à la Malta, Creamy Tomato Soup, Mushroom Stroganoff, Cheese"],
[6,"Cheese","block","Stuffed Mushrooms, Chicken Cordon Bleu, Baked Potato With Vegetables, Baked Potato With Meat, Baked Potato With Seafood, Baked Potato with Beans"],
[6,"Plum","fruits","Plum Marmalade"],
[5,"Rice","bag (1kg)","Rice Pudding, Mushroom Risotto, Pilaf, Rice à la Malta, Paella"],
[4,"Earthworms (Stack 1)","worms","Gagh"],
[4,"Earthworms (Stack 2)","worms","Gagh"],
[4,"Hare Steak","steaks","Rabbit Roast, Hare Sausage"],
[4,"Pear","fruits","Pear Marmalade"],
[3,"Cow Steak (Beef)","steak","Pommdoener, Beef Stew, Beef Sausage"],
[3,"Any Sausage","link","Bangers And Mash, Currywurst, Paprikas Krumpli"],
[3,"Salt Sticks (Makówki) or Crackers","pack","Schnitzel, Chicken Cordon Bleu, Fish Sticks"],
[3,"Pig Steak","steak","Pork And Apple, Pig Sausage"],
[2,"Any Fruit","fruits","Rice Pudding"],
[2,"Caviar","scoops","Baked Potato With Seafood"],
[2,"Canned Baked Beans","can","Baked Potato with Beans, Chili Con Carne"],
[2,"Sliced Pumpkin","slices","Pumpkin Soup"],
[2,"Goat Steak","steaks","Goat Sausage"],
[2,"Sheep Steak","steaks","Sheep Sausage"],
[2,"Deer Steak","steaks","Deer Sausage"],
[2,"Wolf Steak","steaks","Wolf Sausage"],
[1,"Mad Monk Kvass","can","Biff à la Nelson"],
[1,"Strawberry Jam","jar","Rice à la Malta"],
[1,"Alcoholic Tincture","bottle","Ukha"],
[1,"Animal Bones (Stack 1)","bone stack","Bone Broth"],
[1,"Animal Bones (Stack 2)","bone stack","Bone Broth"],
[1,"Canned Spaghetti","can","Spaghetti with Meatballs"],
[1,"Canned Peaches","can","Wobbly Delight with Peaches"],
[1,"Bear Steak","steak","Bear Sausage"]
];
const KEY="mag-powerfood-done-v1";
let done=new Set(),hideDone=false,open=new Set(),term="";
try{const s=localStorage.getItem(KEY);if(s)done=new Set(JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}}
const $=id=>document.getElementById(id);
function render(){
const L=$("list");L.innerHTML="";
const t=term.toLowerCase();let shown=0;
D.forEach((d,i)=>{
const isDone=done.has(i);
if(hideDone&&isDone)return;
if(t&&!(d[1].toLowerCase().includes(t)||d[3].toLowerCase().includes(t)))return;
shown++;
const el=document.createElement("div");
el.className="item"+(isDone?" done":"")+(open.has(i)?" open":"");
const cb=document.createElement("div");cb.className="cb";cb.textContent=isDone?"✓":"";
const body=document.createElement("div");body.style.flex="1";body.style.minWidth="0";
const nm=document.createElement("div");
nm.innerHTML='<span class="qty">'+d[0]+'×</span> <span class="nm"></span> <span class="unit"></span>';
nm.querySelector(".nm").textContent=d[1];nm.querySelector(".unit").textContent="("+d[2]+")";
const more=document.createElement("div");more.className="more";more.textContent=open.has(i)?"hide dishes":"show dishes";
const f=document.createElement("div");f.className="for";f.textContent="Needed for: "+d[3];
more.onclick=e=>{e.stopPropagation();open.has(i)?open.delete(i):open.add(i);render()};
body.append(nm,more,f);el.append(cb,body);
el.onclick=()=>{done.has(i)?done.delete(i):done.add(i);save();render()};
L.append(el);
});
if(!shown){L.innerHTML='<div class="empty">Nothing to show.</div>'}
let u=0,tot=0;D.forEach((d,i)=>{tot+=d[0];if(done.has(i))u+=d[0]});
const p=Math.round(u/tot*100);
$("n1").textContent=done.size;$("n2").textContent=D.length;
$("u1").textContent=u;$("u2").textContent=tot;$("pc").textContent=p;
$("fill").style.width=p+"%";
$("win").style.display=done.size===D.length?"block":"none";
$("hide").classList.toggle("on",hideDone);
}
$("q").oninput=e=>{term=e.target.value;render()};
$("hide").onclick=()=>{hideDone=!hideDone;render()};
$("reset").onclick=()=>{if(done.size&&confirm("Clear all ticks?")){done.clear();save();render()}};
render();
</script>
</body>
</html>
